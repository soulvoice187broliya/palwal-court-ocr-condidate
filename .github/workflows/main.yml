name: Build Court OCR Scanner APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Flutter source files
        shell: bash
        run: |
          set -euo pipefail
          test -f pubspec.yaml || { echo "::error::pubspec.yaml is missing"; exit 1; }
          test -f lib/main.dart || { echo "::error::lib/main.dart is missing"; exit 1; }

      - name: Generate or repair Android project files
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f android/gradlew ] || \
             { [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; } || \
             [ ! -f android/app/src/main/AndroidManifest.xml ]; then
            echo "Android scaffolding is incomplete; regenerating it in this CI workspace."
            rm -rf android
            flutter create --platforms=android --org com.courtocr --project-name court_ocr_scanner .
          fi

          test -f android/gradlew
          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            echo "::error::Flutter did not generate an app-level Gradle file."
            exit 1
          fi
          test -f android/app/src/main/AndroidManifest.xml

      - name: Ensure Android internet permission
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text(encoding="utf-8")
          if "android.permission.INTERNET" not in content:
              updated, count = re.subn(
                  r"(<manifest\b[^>]*>)",
                  r'\1\n    <uses-permission android:name="android.permission.INTERNET"/>',
                  content,
                  count=1,
              )
              if count != 1:
                  raise SystemExit("Could not safely add INTERNET permission to AndroidManifest.xml")
              manifest.write_text(updated, encoding="utf-8")
          PY

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Dart source
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK" || { echo "::error::APK was not created"; exit 1; }
          ls -lh "$APK"

      - name: Install and launch APK on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            set -euo pipefail
            adb install -r build/app/outputs/flutter-apk/app-release.apk
            adb shell monkey -p com.courtocr.court_ocr_scanner 1
            sleep 5
            adb shell pidof com.courtocr.court_ocr_scanner

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Court-OCR-Scanner-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
          
