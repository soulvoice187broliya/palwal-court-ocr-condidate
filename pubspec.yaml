name: court_ocr_scanner
description: Court document OCR scanner with editable Excel register export.
publish_to: "none"
version: 1.0.0+3

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  image_picker: ^1.2.1
  shared_preferences: ^2.5.3
  file_picker: ^10.3.3
  excel: ^4.0.6
  path_provider: ^2.1.5
  share_plus: ^12.0.0
  http: ^1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/GH.xlsx
